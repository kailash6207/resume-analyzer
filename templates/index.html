<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="result-container">
        <h1>Resume Analyzer</h1>
        <form action="/analyze" method="POST" enctype="multipart/form-data">
            <label>Upload Resume (PDF or DOCX):</label><br>
            <input type="file" name="resume" accept=".pdf,.docx" required><br><br>
            
            <label>Paste Job Description (Optional):</label><br>
            <textarea name="job_description" rows="5" style="width: 100%; margin-top: 10px;" placeholder="Paste the job requirements here..."></textarea><br><br>

            <button type="submit">Analyze Resume</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
